<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hello 系列教程 | RenYan.org</title>
        <style>
            :root {
                --bg: #050505;
                --card-bg: #111;
                --text: #eee;
                --accent: #00ff9d; /* 极客绿 */
                --border: #222;
            }
            body {
                font-family:
                    "Fira Code",
                    "Inter",
                    -apple-system,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .container {
                max-width: 1000px;
                width: 90%;
                padding: 40px 0;
            }
            header {
                text-align: left;
                margin-bottom: 60px;
                border-left: 4px solid var(--accent);
                padding-left: 25px;
            }
            h1 {
                font-size: 3.5rem;
                margin: 0;
                letter-spacing: -3px;
            }
            h1 span {
                color: var(--accent);
            }
            .tagline {
                opacity: 0.6;
                font-size: 1.1rem;
                margin-top: 10px;
                text-transform: uppercase;
                letter-spacing: 2px;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 20px;
            }
            .card {
                background: var(--card-bg);
                border: 1px solid var(--border);
                padding: 30px;
                text-decoration: none;
                color: inherit;
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
            }
            .card:hover {
                border-color: var(--accent);
                transform: translateY(-5px);
            }
            .card::after {
                content: "→";
                position: absolute;
                bottom: 20px;
                right: 20px;
                font-size: 1.5rem;
                color: var(--accent);
                opacity: 0;
                transition: 0.3s;
            }
            .card:hover::after {
                opacity: 1;
            }

            .card h2 {
                margin: 0 0 15px 0;
                font-size: 1.6rem;
                color: #fff;
            }
            .card p {
                font-size: 0.9rem;
                line-height: 1.6;
                opacity: 0.7;
                margin-bottom: 20px;
            }
            .lang-tag {
                font-size: 0.7rem;
                color: var(--accent);
                border: 1px solid var(--accent);
                padding: 2px 8px;
                border-radius: 3px;
            }

            footer {
                margin-top: 60px;
                font-size: 0.8rem;
                opacity: 0.4;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Hello<span>.</span>编程</h1>
                <p class="tagline">RenYan's —— 只言核心，研透底层。</p>
            </header>

            <main class="grid">
                <!-- Hello C -->
                <a href="https://renyan.org/hello/c/" class="card">
                    <span class="lang-tag">Foundation</span>
                    <h2>Hello C</h2>
                    <p>研透底层逻辑。探索指针、内存管理与硬件交互的奥秘。</p>
                </a>

                <!-- Hello Go -->
                <a
                    href="https://renyan.org/hello/go/about-hello.html"
                    class="card"
                >
                    <span class="lang-tag">Cloud Native</span>
                    <h2>Hello Go</h2>
                    <p>拥抱现代工程。掌握高并发通道与极简开发的生产力哲学。</p>
                </a>

                <!-- Hello Rust -->
                <a
                    href="https://renyan.org/hello/rust/about-hello.html"
                    class="card"
                >
                    <span class="lang-tag">System</span>
                    <h2>Hello Rust</h2>
                    <p>
                        掌控安全极限。学习所有权机制，构建新一代高性能系统软件。
                    </p>
                </a>

                <!-- Hello Swift -->
                <a
                    href="https://renyan.org/hello/swift/about-hello.html"
                    class="card"
                >
                    <span class="lang-tag">Creative</span>
                    <h2>Hello Swift</h2>
                    <p>
                        优雅的创作艺术。为 Apple
                        全平台构建丝滑、高效的原生应用。
                    </p>
                </a>
            </main>

            <footer>
                &copy; 2026 RENYAN.ORG LABS // CORE ONLY, DEEP RESEARCH.
            </footer>
        </div>
    </body>
</html>
